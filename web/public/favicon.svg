<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="8" fill="#FFFDF9"/>

  <!-- Curly hair: three overlapping circles -->
  <circle cx="10" cy="14" r="7" fill="#180900"/>
  <circle cx="16" cy="11" r="7" fill="#180900"/>
  <circle cx="22" cy="14" r="7" fill="#180900"/>

  <!-- Face -->
  <circle cx="16" cy="20" r="9" fill="#F5C08A"/>

  <!-- Eyes -->
  <circle cx="12.5" cy="19" r="1.4" fill="#180900"/>
  <circle cx="19.5" cy="19" r="1.4" fill="#180900"/>

  <!-- Smile -->
  <path d="M 12.5 22 Q 16 25.5 19.5 22" stroke="#180900" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Scarf stripe peek at bottom -->
  <path d="M 9 28.5 Q 16 30.5 23 28.5" stroke="#CC2936" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
